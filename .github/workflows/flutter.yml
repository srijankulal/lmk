name: Flutter CI & Build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Test Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java Development Kit (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Print Flutter & Dart version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Run widget & unit tests
        run: flutter test

      - name: Calculate next release version
        id: version
        run: |
          git fetch --tags --force || true

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
            BUILD_NUMBER=$(echo "$VERSION" | sed -E "s/^[0-9]+\.[0-9]+\.([0-9]+).*/\1/")
            [ -z "$BUILD_NUMBER" ] && BUILD_NUMBER="1"
          else
            # Extract major.minor prefix from pubspec.yaml (e.g. 0.1)
            BASE_PREFIX=$(grep '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([0-9]+\.[0-9]+)\..*/\1/' | tr -d ' "\r')
            [ -z "$BASE_PREFIX" ] && BASE_PREFIX="0.1"

            # Find latest tag for this prefix (e.g. v0.1.1-alpha)
            LATEST_TAG=$(git tag -l "v${BASE_PREFIX}.*" | sort -V | tail -n 1)
            echo "Latest existing tag: $LATEST_TAG"

            if [ -z "$LATEST_TAG" ]; then
              NEXT_PATCH=1
            else
              CURRENT_PATCH=$(echo "$LATEST_TAG" | sed -E "s/^v[0-9]+\.[0-9]+\.([0-9]+).*/\1/")
              if [ -z "$CURRENT_PATCH" ]; then
                NEXT_PATCH=1
              else
                NEXT_PATCH=$((CURRENT_PATCH + 1))
              fi
            fi

            VERSION="${BASE_PREFIX}.${NEXT_PATCH}-alpha"
            TAG="v${VERSION}"
            BUILD_NUMBER=${NEXT_PATCH}
          fi

          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "build_number=${BUILD_NUMBER}" >> $GITHUB_OUTPUT
          echo "==> Generated Release Version: ${VERSION} (Tag: ${TAG}, Build Number: ${BUILD_NUMBER}) <=="

      - name: Build Android Release APK
        run: |
          flutter build apk --release \
            --build-name=${{ steps.version.outputs.version }} \
            --build-number=${{ steps.version.outputs.build_number }} \
            --android-skip-build-dependency-validation

      - name: Prepare named APK asset
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/LMK-${{ steps.version.outputs.tag }}.apk"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lmk-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Publish / Update GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "LMK ${{ steps.version.outputs.tag }}"
          prerelease: true
          make_latest: true
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/LMK-${{ steps.version.outputs.tag }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
